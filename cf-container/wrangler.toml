# Isolated blender Cloudflare Container door. Not the studio Worker.
# Deploy from an amd64 host (the Vultr proof box). This Mac is arm64.

name = "vivijure-blender"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[containers]]
class_name = "BlenderContainer"
image = "../Dockerfile.cf"
image_build_context = ".."
instance_type = "standard-1"
max_instances = 1

[[durable_objects.bindings]]
name = "BLENDER"
class_name = "BlenderContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BlenderContainer"]
