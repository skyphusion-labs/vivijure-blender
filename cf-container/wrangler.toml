# Isolated blender Cloudflare Container door. Not the studio Worker.
# Deployed by .github/workflows/deploy.yml on a GitHub-hosted ubuntu-latest runner (amd64, with
# Docker): wrangler builds Dockerfile.cf for linux/amd64, so do not deploy from an arm64 machine.

name = "vivijure-blender"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Already this Worker's custom domain (AAAA 100::, proxied).
[[routes]]
pattern = "blender.skyphusion.org"
custom_domain = true

# Door bearer. Value is a wrangler secret, never a [vars] entry.
[secrets]
required = ["LOCAL_FINISH_TOKEN"]

[[containers]]
class_name = "BlenderContainer"
image = "../Dockerfile.cf"
image_build_context = ".."
instance_type = "standard-1"
max_instances = 2

[[durable_objects.bindings]]
name = "BLENDER"
class_name = "BlenderContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BlenderContainer"]
