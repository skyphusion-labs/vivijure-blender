name: code-coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  code-quality: write
  pull-requests: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # DEVIATION from the vivijure-audio-upscale template, and it is required:
      # this repo's tests import handler.py, which imports boto3 / requests / runpod
      # at module scope. Without requirements.txt the suite fails at COLLECTION with
      # ImportError, which is a red job rather than a low number -- but it would look
      # like a coverage failure rather than a missing dependency.
      - name: Install test deps
        run: pip install -r requirements.txt coverage==7.10.7 pytest==9.1.1
      - name: Run CPU surface tests with coverage
        run: coverage run -m pytest -q tests/
      - run: coverage xml
      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: ./coverage.xml
          language: python
