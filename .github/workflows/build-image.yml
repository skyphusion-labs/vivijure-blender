name: build-image

# Build the vivijure-blender RunPod serverless image and push it to GHCR.
#
# Unified image workflow (mirrors vivijure-upscale): a pushed SemVer tag (v0.1.0)
# publishes the immutable, pinnable release image tagged with the clean version
# (0.1.0), major.minor (0.1), and short commit sha. A push to main that touches image
# inputs still BUILDS as a smoke but does NOT push; only a version tag or
# workflow_dispatch publishes. A bare merge to main never publishes.
#
# Image bake runs on Plane C [self-hosted, bake-capable] (org group
# vivijure-gpu-builds, allow-public ON). Triggers are workflow_dispatch, main,
# and version tags -- not pull_request -- so a fork cannot reach the fleet.
# Free-disk step stays gated on github-hosted for a hosted fallback.
#
# :latest EXISTS and TRACKS THE NEWEST RELEASE. NOTHING MAY EVER PIN IT.
# RunPod templates, compose files and connectivity-directory services pin an explicit
# version (0.1.1) or a digest (sha256:...), never `latest`. That is the real invariant:
# the point was never that the tag must not exist, it was that a deploy must never
# FLOAT. "Never pin latest" serves that fully, and unlike the old wording it is a rule
# this workflow can actually hold.
#
# This header previously read "There is NO :latest". That was false. docker/metadata-action
# defaults to `flavor: latest=auto`, which adds the tag whenever a SEMVER tag matches,
# regardless of the `tags:` list below -- and v0.1.1, the FIRST real tag-push bake in this
# repo, minted one. The claim had never been exercised: 0.1.0 was published by
# workflow_dispatch, which carries no semver tag, so latest=auto never fired.
#
# `latest=auto` is KEPT DELIBERATELY. GHCR deletes by VERSION (digest), and :latest shares
# its digest with 0.1.1 / 0.1 / sha-<short>, so the tag cannot be removed without deleting
# the release. Setting latest=false would therefore FREEZE :latest at 0.1.1 forever, and a
# STALE :latest is strictly more dangerous than a current one -- it is the tag most likely
# to be pulled by accident, and it would silently serve an old image.
#
# Plane C now. The in-repo sync-gpu-allowlist job stays gone: it blocked v0.1.1
# with "no tags-kind workflow declared for repo vivijure-blender" and published
# nothing. Group membership and selected_workflows live in fleet-chezmoi
# scripts/sync-vivijure-gpu-builds-allowlist.sh. Do not re-add the job here.
#
# A workflow_dispatch build publishes ONLY `sha-<short>`. It deliberately mints no
# version number: a dispatch is not a release. This previously carried a hardcoded
# `type=raw,value=0.1.0` on dispatch, which would have republished whatever tree was
# current as `0.1.0` -- overwriting the release this same header calls immutable.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.serve
      - handler.py
      - runpod_http_serve.py
      - serve.py
      - requirements.txt
      - scripts/**
      - .github/workflows/build-image.yml
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, bake-capable]
    timeout-minutes: 240
    env:
      IMAGE: ghcr.io/skyphusion-labs/vivijure-blender
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (hosted runners only)
        if: runner.environment == 'github-hosted'
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          echo "--- after ---"; df -h /

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build image
        # Plain docker build rather than build-push-action/buildx, because the serve overlay
        # below builds FROM this image and must resolve it LOCALLY. buildx leaves the release
        # image in the buildkit cache, so the overlay would silently re-resolve its base from
        # the registry and build on whatever GHCR happens to hold rather than on what this job
        # just produced. That failure has no tell: the build succeeds and the log looks the
        # same. (vivijure-audio-upscale also uses plain docker build, but for a DIFFERENT
        # reason, a host-prep tag rewrite. This repo has no such prep; the reason here is the
        # overlay, and saying so keeps the next reader from removing it as cargo cult.)
        # meta.outputs.tags is newline-separated, so it must not expand inline in a for loop.
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          ARGS=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            ARGS="$ARGS -t $t"
          done <<< "$META_TAGS"
          docker build $ARGS .

      - name: Push image
        # Publish ONLY on a version tag or a deliberate workflow_dispatch; a bare merge to
        # main builds the image above as a smoke and never pushes it.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker push "$t"
          done <<< "$META_TAGS"

      - name: Build serve overlay
        # ALWAYS builds, so a bare merge to main smoke-builds the overlay exactly like the
        # release image; only the push below is gated. Plain docker build for the same reason
        # as above: buildx would re-resolve the base from the registry and bypass the local
        # image this job just produced.
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${META_VERSION:-}" ]; then
            echo "::error::metadata-action produced no version; cannot resolve a serve base"
            exit 1
          fi
          base="${IMAGE}:${META_VERSION}"

          # CONTROL 1 -- the base must be one of the tags THIS job built. Whole-line match
          # (grep -Fxq), because a substring match would accept a near-miss tag, which is the
          # defect class that keeps costing this crew real time.
          if ! printf "%s\\n" "$META_TAGS" | grep -Fxq "$base"; then
            echo "::error::resolved serve base ${base} is not among the tags this job built:"
            printf "%s\\n" "$META_TAGS"
            exit 1
          fi

          # CONTROL 2 -- and it must already be LOCAL. Without this, docker would silently
          # PULL a same-named tag from GHCR and build the overlay on a base that is NOT the
          # one just built. That failure has no tell: the build succeeds and the log looks
          # identical. This is also what catches it if the release build above ever goes back
          # to buildx, since buildx would leave nothing local to find.
          if ! docker image inspect "$base" >/dev/null 2>&1; then
            echo "::error::serve base ${base} absent locally; refusing to let docker pull a stale one"
            exit 1
          fi
          echo "serve base ${base} -> image id $(docker image inspect --format "{{.Id}}" "$base")"

          # Derive the serve tags FROM the release tags rather than restating them: a hand-kept
          # list forks from its source, and the fork reads as authoritative.
          : > "$RUNNER_TEMP/serve-tags.txt"
          m=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            m=$((m + 1))
            echo "${t}-serve" >> "$RUNNER_TEMP/serve-tags.txt"
          done <<< "$META_TAGS"
          n="$(wc -l < "$RUNNER_TEMP/serve-tags.txt")"
          # DENOMINATOR -- printed, and a floor, so a zero is a harness failure and never a pass.
          echo "derived ${n} serve tags of ${m} release tags:"
          cat "$RUNNER_TEMP/serve-tags.txt"
          if [ "$m" -eq 0 ] || [ "$n" -ne "$m" ]; then
            echo "::error::derived ${n} serve tags from ${m} release tags; expected 1:1 and at least one"
            exit 1
          fi

          ARGS=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            ARGS="$ARGS -t $t"
          done < "$RUNNER_TEMP/serve-tags.txt"
          docker build -f Dockerfile.serve --build-arg "BLENDER_IMAGE=${base}" $ARGS .

      - name: Push serve overlay
        # Same gate as the release push: only a version tag or a deliberate workflow_dispatch
        # publishes. A bare merge to main built the overlay above and stops there.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/serve-tags.txt" ]; then
            echo "::error::serve tag list is missing or empty; the build step did not produce one"
            exit 1
          fi
          pushed=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker push "$t"
            pushed=$((pushed + 1))
          done < "$RUNNER_TEMP/serve-tags.txt"
          echo "pushed ${pushed} of $(wc -l < "$RUNNER_TEMP/serve-tags.txt") serve tags"
          [ "$pushed" -gt 0 ]

      - name: Remove local images to free runner disk
        if: always()
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -uo pipefail
          if [ -s "$RUNNER_TEMP/serve-tags.txt" ]; then
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              docker image rm "$t" || true
            done < "$RUNNER_TEMP/serve-tags.txt"
          fi
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker image rm "$t" || true
          done <<< "$META_TAGS"
