name: build-image

# Build the vivijure-blender RunPod serverless image and push it to GHCR.
#
# Unified image workflow (mirrors vivijure-upscale): a pushed SemVer tag (v0.1.0)
# publishes the immutable, pinnable release image tagged with the clean version
# (0.1.0), major.minor (0.1), and short commit sha. There is NO :latest -- RunPod
# endpoint templates pin an explicit :version. A push to main that touches image
# inputs still BUILDS as a smoke but does NOT push; only a version tag or
# workflow_dispatch publishes. A bare merge to main never publishes.
#
# Public repo -> GitHub-hosted ubuntu-latest (fork-safe). Free-disk step reclaims
# hosted runner space for the CUDA base + Blender tarball.
#
# NO Plane C admission gate. This repo has zero `[self-hosted, ...]` jobs, so it is
# not a Plane C repo and does not belong in the `vivijure-gpu-builds` runner group.
# It previously carried a `sync-gpu-allowlist` job (inherited from the vivijure-upscale
# template) that ran the fleet-chezmoi allowlist sync on every tag and BLOCKED `build`
# behind it -- v0.1.1 failed there with "no tags-kind workflow declared for repo
# vivijure-blender" and published nothing. The siblings that still carry it are residue
# of a July `[self-hosted, gpu]` migration that was reverted days later; that is a
# doctrine question for the fleet context, not a reason to keep a scar here.
# Removing it also stops handing RUNNER_GROUP_ADMIN_TOKEN to a job with no use for it.
#
# A workflow_dispatch build publishes ONLY `sha-<short>`. It deliberately mints no
# version number: a dispatch is not a release. This previously carried a hardcoded
# `type=raw,value=0.1.0` on dispatch, which would have republished whatever tree was
# current as `0.1.0` -- overwriting the release this same header calls immutable.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - handler.py
      - requirements.txt
      - scripts/**
      - .github/workflows/build-image.yml
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IMAGE: ghcr.io/skyphusion-labs/vivijure-blender
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (hosted runners only)
        if: runner.environment == 'github-hosted'
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          echo "--- after ---"; df -h /

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
