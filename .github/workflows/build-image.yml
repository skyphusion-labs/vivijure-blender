name: build-image

# Build the vivijure-blender RunPod serverless image and push it to GHCR.
#
# Unified image workflow (mirrors vivijure-upscale): a pushed SemVer tag (v0.1.0)
# publishes the immutable, pinnable release image tagged with the clean version
# (0.1.0), major.minor (0.1), and short commit sha. There is NO :latest -- RunPod
# endpoint templates pin an explicit :version. A push to main that touches image
# inputs still BUILDS as a smoke but does NOT push; only a version tag or
# workflow_dispatch publishes. A bare merge to main never publishes.
#
# Public repo -> GitHub-hosted ubuntu-latest (fork-safe). Free-disk step reclaims
# hosted runner space for the CUDA base + Blender tarball.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - handler.py
      - requirements.txt
      - scripts/**
      - .github/workflows/build-image.yml
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-gpu-allowlist:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fleet-chezmoi (sync script)
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/fleet-chezmoi
          ref: ce709cb073e4b65c47505cca7f5bbbbb44ad8210
          token: ${{ secrets.RUNNER_GROUP_ADMIN_TOKEN }}

      - name: Verify fleet-chezmoi pin
        run: |
          set -euo pipefail
          expected="ce709cb073e4b65c47505cca7f5bbbbb44ad8210"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::fleet-chezmoi pin mismatch: expected ${expected} got ${actual}"
            exit 1
          fi
          echo "fleet-chezmoi pin OK (${actual:0:7})"

      - name: Sync vivijure-gpu-builds allowlist
        env:
          GH_TOKEN: ${{ secrets.RUNNER_GROUP_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/sync-vivijure-gpu-builds-allowlist.sh \
            --apply \
            --ensure-tag "vivijure-blender" "${{ github.ref_name }}"

  build:
    needs: sync-gpu-allowlist
    if: always() && (needs.sync-gpu-allowlist.result == 'success' || needs.sync-gpu-allowlist.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IMAGE: ghcr.io/skyphusion-labs/vivijure-blender
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (hosted runners only)
        if: runner.environment == 'github-hosted'
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          echo "--- after ---"; df -h /

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=0.1.0,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
